name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npx --yes @vscode/vsce package --out ai-terminal-sessions.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: ai-terminal-sessions-vsix
          path: ai-terminal-sessions.vsix
